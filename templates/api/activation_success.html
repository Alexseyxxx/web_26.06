      window.location.href = "/";
    }, 5000);

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">
  <div class="bg-white shadow-md rounded-lg p-8 text-center max-w-md">

    <p class="text-gray-700 mb-6">Вы будете перенаправлены на главную страницу через несколько секунд...</p>
    <a href="/" class="inline-block bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Перейти сразу
    </a>
  </div>
</body>
</html>
